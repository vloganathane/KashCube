name: kash_cube
description: "Privacy-first financial tracker for India. Auto-captures UPI/bank transactions from SMS, manages credits (udhar/khata). 100% local, zero network calls."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  sqflite: ^2.4.1
  path: ^1.9.1

  # SMS Reading (Android)
  telephony: ^0.2.0

  # Charts & Visualization
  fl_chart: ^0.70.2

  # Authentication
  local_auth: ^2.3.0

  # Date/Number Formatting
  intl: ^0.20.2

  # File System
  path_provider: ^2.1.5

  # Share/Export
  share_plus: ^10.1.4

  # Local Notifications (no network — 100% on-device)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # Utilities
  equatable: ^2.0.7
  uuid: ^4.5.1
  crypto: ^3.0.6
  image_picker: ^1.2.1
  file_picker: ^10.3.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/play_store_512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/play_store_512.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
