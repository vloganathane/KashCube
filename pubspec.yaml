name: kash_cube
description: "Privacy-first financial tracker for India. Auto-captures UPI/bank transactions from SMS, manages credits (udhar/khata). 100% local, zero network calls."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  sqflite: ^2.4.1
  sqflite_common_ffi_web: ^1.1.1
  path: ^1.9.1

  # SMS Reading (Android)
  telephony: ^0.2.0

  # Charts & Visualization
  fl_chart: ^0.70.2

  # Authentication
  local_auth: ^2.3.0

  # Date/Number Formatting
  intl: ^0.20.2

  # File System
  path_provider: ^2.1.5

  # Preferences
  shared_preferences: ^2.3.4

  # Share/Export
  share_plus: ^10.1.4
  pdf: ^3.11.0
  printing: ^5.13.0
  archive: ^3.6.1   # ZIP for GSTR-1 CSV workbook — pure Dart, zero network calls
  excel: ^4.0.6     # XLSX export for GSTR workbooks — pure Dart, zero network calls

  # Subscriptions — Google Play Billing (platform IAP, no KashCube server)
  in_app_purchase: ^3.2.0

  # KashCube Web — LAN HTTP server (WhatsApp Web model, zero internet)
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.1

  # Local Notifications (no network — 100% on-device)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.1

  # URL launching (WhatsApp/SMS/Email OS intents — no network calls made by app)
  url_launcher: ^6.3.1
  flutter_contacts: ^1.1.9+2  # One-shot OS picker + pre-filled insert — zero READ/WRITE_CONTACTS permission

  # File Operations (open PDF in system viewer — no network calls)
  open_file: ^3.5.10

  # Image compression for party/business card photos — fully local
  flutter_image_compress: ^2.4.0

  # AES-256-GCM encryption for .kashcube backup export — 100% on-device
  encrypt: ^5.0.3

  # Ed25519 keypair signing + Argon2id KDF — LAN sync and backup recovery
  # Pure Dart, no network calls, no platform channels
  cryptography: ^2.7.0

  # mDNS service discovery for LAN sync (Android NsdManager / iOS Bonjour)
  # Supports TXT records (attributes) so secondaries can see the primary's
  # display name before pairing. Purely local — no internet required.
  bonsoir: ^5.1.2

  # Secure key-value storage (OS keystore) — used exclusively for optional
  # GSP API key when user explicitly opts into e-Way Bill auto-generation.
  # Default state: GSP is disabled, nothing is stored here.
  flutter_secure_storage: ^9.2.4

  # Utilities
  equatable: ^2.0.7
  uuid: ^4.5.1
  crypto: ^3.0.6
  image_picker: ^1.2.1
  file_picker: ^10.3.10

  # QR code generation & scanning (fully offline, no network)
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4

  # Web platform interop — used only in http_client_web.dart (browser XHR).
  # Already a transitive dep; listed explicitly for clarity.
  web: ^1.1.1

  # Deep link / App Link handling — routes kashcube.com/c URLs into the app.
  # No network calls made by this package; it only listens to OS intent delivery.
  app_links: ^6.3.2

  # Background task scheduling — daily Action Center overdue notification
  # (fires at ~9 AM even when app is closed; all logic runs on-device)
  workmanager: ^0.6.0

  # Country / phone-code picker — all data is bundled, zero network calls
  world_countries: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/play_store_512.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/play_store_512.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo-white.png
    - assets/data/in_pincodes.json
    - assets/hns_sac/HSN_SAC - HSN_MSTR.csv
    - assets/hns_sac/HSN_SAC - SAC_MSTR.csv
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
